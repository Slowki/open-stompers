[project]
name = "open_stompers_hardware_models"
version = "0.1.0"
description = "Hardware models for Open Stompers"
requires-python = "==3.12.*"
dependencies = [
  "fast-simplification>=0.1.12",
  "jinja2>=3.1.6",
  "linkforge-core>=1.5.3,<2",
  "trimesh>=4.0",
]

[project.scripts]
open_stompers_hardware_models = "open_stompers_hardware_models.cli:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"
