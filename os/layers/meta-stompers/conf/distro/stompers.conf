require conf/distro/poky.conf

DISTRO = "stompers"
DISTRO_NAME = "Stompers OS"
DISTRO_VERSION = "1.0.0"
MAINTAINER = "Open Stompers"

TARGET_VENDOR = "-stompers"
SDK_VENDOR = "-stompersdk"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}/${MACHINE}"

INIT_MANAGER = "systemd"

DISTRO_FEATURES_OPTED_OUT = "3g nfc nfs x11 wayland vulkan ptest pulseaudio debuginfod gobject-introspection-data"
DISTRO_FEATURES:append = " pam usbgadget usbhost"

PACKAGE_CLASSES = "package_ipk"

hostname:pn-base-files = "stomper"

# Keep /var/log on disk so the persistent journal survives reboots.
FILESYSTEM_PERMS_TABLES:remove = "files/fs-perms-volatile-log.txt"

# Keep SSH host keys stable across A/B updates: sshd reads them from
# /etc/ssh/hostkeys, which stompers-data bind-mounts over /data/ssh.
OPENSSH_HOST_KEY_DIR = "/etc/ssh/hostkeys"

# Jetson: A/B rootfs slots on NVMe, each half of ROOTFSPART_SIZE_DEFAULT (16 GiB).
# The rest of the disk becomes the persistent `data` partition.
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT:tegra = "1"
ROOTFSPART_SIZE_DEFAULT:tegra = "34359738368"

# Jetson lockup debugging (see lockup-debug.cfg): dump every CPU's backtrace
# when a soft or hard lockup is detected.
KERNEL_ARGS:append:tegra = " softlockup_all_cpu_backtrace=1 hardlockup_all_cpu_backtrace=1"

# Rockchip: rootfsA and rootfsB in the wic image, `data` created on first boot
# from the rest of the SD card or eMMC. Slots are switched through the U-Boot environment.
STOMPERS_ROOTFS_SLOT_SIZE ?= "4096M"
WKS_FILE:rockchip = "stompers-rockchip.wks"
WICVARS:append:rockchip = " STOMPERS_ROOTFS_SLOT_SIZE"
MACHINE_FEATURES:append:rockchip = " rk-u-boot-env"
RK_IMAGE_INCLUDES_UBOOT_ENV:rockchip = "1"
