header:
  version: 18

build_system: openembedded
distro: stompers

target:
  - stompers-image
  - stompers-image-swupdate

repos:
  stompers:
    layers:
      os/layers/meta-stompers:

  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    path: layers/bitbake
    layers:
      .: disabled

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    path: layers/openembedded-core
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    path: layers/meta-yocto
    layers:
      meta-poky:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: wrynose
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-networking:
      meta-python:

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate.git
    branch: wrynose
    path: layers/meta-swupdate

local_conf_header:
  stompers: |
    INHERIT += "rm_work"
    BB_DISKMON_DIRS ??= "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},100M,1K HALT,${DL_DIR},100M,1K HALT,${SSTATE_DIR},100M,1K"
