[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Stephan Wolski"]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
open-stompers-hardware = { path = "crates/open-stompers-hardware" }
open-stompers-schemas = { path = "crates/open-stompers-schemas" }
open-stompers-microduck = { path = "crates/open-stompers-microduck" }
open-stompers-mini-pi = { path = "crates/open-stompers-mini-pi" }

anyhow = "1.0.104"
nalgebra = "0.34"
ort = { version = "=2.0.0-rc.8", default-features = false, features = [
  "half",
  "load-dynamic",
  "ndarray",
] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
flatbuffers = "25.12.19"
gilrs = "0.11.2"
rerun = { version = "0.38", default-features = false, features = [
  "sdk",
  "rrd",
  "server",
  "log_setup",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }
tokio-serial = "5.4"
tracing = "0.1"
uom = { version = "0.38.0", features = ["f32", "f64", "si", "std"], default-features = false }
